name: Download Android Build Tools 36 for Windows

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install Windows Build Tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "SDK Manager not found: $SDKMANAGER"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses

          REPO_OS_OVERRIDE=windows "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --install "build-tools;36.0.0"

          test -f "$SDK_ROOT/build-tools/36.0.0/aapt2.exe"

      - name: Create ZIP
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          cd "$SDK_ROOT/build-tools"
          zip -r "$GITHUB_WORKSPACE/build-tools_r36_windows.zip" 36.0.0

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: build-tools_r36_windows
          path: build-tools_r36_windows.zip
          if-no-files-found: error
